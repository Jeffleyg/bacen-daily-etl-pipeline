name: Daily USD/BRL Quant Pipeline

on:
  schedule:
    # Executa de segunda a sexta-feira às 22:00 UTC (19:00 Horário de Brasília)
    # Momento em que o BACEN já consolidou a cotação PTAX de fechamento do dia
    - cron: '0 22 * * 1-5'
  workflow_dispatch: # Permite disparar o pipeline manualmente a qualquer momento pelo botão no GitHub

permissions:
  contents: write

jobs:
  run-forex-etl:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Ambiente Python
        uses: setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: ⚡ Executar Pipeline ETL do BACEN
        run: |
          python etl_dolar.py

      - name: 💾 Persistir e Sincronizar Base Parquet no Repositório
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dolar_master_analytics.parquet
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): automated daily USD/BRL market update [skip ci]" && git push origin main)