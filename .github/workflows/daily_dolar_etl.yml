name: Daily USD/BRL Quant Pipeline

on:
  schedule:
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-forex-etl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Python
        uses: setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependencias
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pyarrow fastparquet numpy

      - name: Executar Pipeline ETL
        run: |
          if [ -f "etl_dolar.py" ]; then
            python etl_dolar.py
          elif [ -f "etl_pipeline.py" ]; then
            python etl_pipeline.py
          fi

      - name: Commit e Push dos Dados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): automated market update [skip ci]" && git push)